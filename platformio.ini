; =====================================================================
;  OBD2 ESP32 CYD -- ตัวจำลองรถ + อะแดปเตอร์ ELM327 (Bluetooth Classic SPP)
;
;  ใช้กับบอร์ด ESP32 รุ่นดั้งเดิม (ESP32-WROOM-32 DevKit) เท่านั้น
;  ESP32-S3 / C3 / C6 ไม่มี Bluetooth Classic จึงใช้ไม่ได้
; =====================================================================

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@7.0.1   ; ล็อกเวอร์ชัน (Arduino core 2.0.17) ให้ตรงกับเฟิร์มแวร์ CYD
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; Bluetooth Classic (Bluedroid) ทำให้โปรแกรมใหญ่เกินพาร์ทิชันปกติ ต้องใช้ huge_app
board_build.partitions = huge_app.csv

build_flags =
  -std=gnu++17

build_unflags =
  -std=gnu++11
